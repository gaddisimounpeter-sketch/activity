<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4-Shot Vertical Photobooth</title>
    <style>
        :root {
            --primary-color: #ff2d55;
            --bg-color: #1c1c1e;
            --text-color: #f2f2f7;
            --panel-bg: #2c2c2e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 { margin: 10px 0; font-size: 1.5rem; text-align: center; }

        .filters-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .filter-btn {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 8px 14px;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
        }
        .filter-btn.active {
            border-color: var(--primary-color);
            background-color: rgba(255,45,85,0.15);
        }

        .booth-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 3/4;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        video.filter-bw { filter: grayscale(100%); }
        video.filter-sepia { filter: sepia(80%) contrast(110%); }
        video.filter-normal { filter: none; }

        #timer-display {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        #timer-display.active { opacity: 1; }

        .flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none;
        }
        .flash.active { animation: flash-animation 0.5s ease; }
        @keyframes flash-animation { 0% { opacity: 0.8; } 100% { opacity: 0; } }

        .controls { margin-top: 20px; width: 100%; display: flex; justify-content: center; }
        button.action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,45,85,0.4);
        }
        button.action-btn:active { transform: scale(0.97); }
        button.action-btn:disabled { background-color: #636366; cursor: not-allowed; }

        #strip-container {
            margin-top: 30px;
            width: 100%;
            max-width: 260px;
            display: none;
            flex-direction: column;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            gap: 12px;
            align-items: center;
        }

        #final-photo-img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        .save-hint {
            font-size: 0.9rem;
            color: #000;
            text-align: center;
            font-weight: 500;
            margin: 0;
        }
    </style>
</head>
<body>

    <h2>4-Shot Photobooth</h2>

    <div class="filters-container">
        <button class="filter-btn active" data-filter="normal">Normal</button>
        <button class="filter-btn" data-filter="bw">B & W</button>
        <button class="filter-btn" data-filter="sepia">Warm</button>
    </div>
    
    <div class="booth-container">
        <video id="camera-stream" autoplay playsinline muted class="filter-normal"></video>
        <div id="timer-display"></div>
        <div id="flash-effect" class="flash"></div>
    </div>

    <div class="controls">
        <button id="start-btn" class="action-btn">Start 4-Shot Session</button>
    </div>
    
    <canvas id="snapshot-canvas" style="display:none;"></canvas>
    
    <div id="strip-container">
        <p class="save-hint">👇 Long press to save.</p>
        <img id="final-photo-img" alt="Photo Strip">
    </div>

    <script>
        const video = document.getElementById('camera-stream');
        const startBtn = document.getElementById('start-btn');
        const timerDisplay = document.getElementById('timer-display');
        const flashEffect = document.getElementById('flash-effect');
        const stripContainer = document.getElementById('strip-container');
        const finalPhotoImg = document.getElementById('final-photo-img');
        const filterBtns = document.querySelectorAll('.filter-btn');
        
        const snapshotCanvas = document.getElementById('snapshot-canvas');
        const ctxSnap = snapshotCanvas.getContext('2d');

        const TOTAL_SHOTS = 4;
        const COUNTDOWN_SECONDS = 3;
        let isCapturing = false;
        let currentFilter = 'normal';

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                video.className = '';
                video.classList.add(`filter-${currentFilter}`);
            });
        });

        async function initCamera() {
            try {
                const constraints = {
                    video: { facingMode: 'user', aspect_ratio: { ideal: 3/4 } },
                    audio: false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
            } catch (err) {
                console.error("Camera Error:", err);
                alert("Camera access denied.");
            }
        }

        const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

        startBtn.addEventListener('click', async () => {
            if (isCapturing) return;
            isCapturing = true;
            startBtn.disabled = true;
            startBtn.innerText = "Get Ready!";
            stripContainer.style.display = 'none';

            const photoDataUrls = [];

            for (let i = 1; i <= TOTAL_SHOTS; i++) {
                for (let c = COUNTDOWN_SECONDS; c >= 1; c--) {
                    timerDisplay.innerText = c;
                    timerDisplay.classList.add('active');
                    await wait(750);
                    timerDisplay.classList.remove('active');
                    await wait(250);
                }

                flashEffect.classList.add('active');
                await wait(100);
                flashEffect.classList.remove('active');

                snapshotCanvas.width = video.videoWidth;
                snapshotCanvas.height = video.videoHeight;
                
                // Siguraduhing nailalapat ang filter sa canvas rendering
                ctxSnap.save(); // I-save ang default state
                if (currentFilter === 'bw') {
                    ctxSnap.filter = 'grayscale(100%)';
                } else if (currentFilter === 'sepia') {
                    ctxSnap.filter = 'sepia(80%) contrast(110%)';
                } else {
                    ctxSnap.filter = 'none';
                }

                ctxSnap.scale(-1, 1);
                ctxSnap.drawImage(video, -snapshotCanvas.width, 0);
                ctxSnap.restore(); // I-restore para hindi maipon ang filter settings

                photoDataUrls.push(snapshotCanvas.toDataURL('image/jpeg', 0.9));
                
                if(i < TOTAL_SHOTS) await wait(500);
            }

            startBtn.innerText = "Session Complete!";
            isCapturing = false;

            await generatePhotoStrip(photoDataUrls);

            await wait(1500);
            startBtn.innerText = "Start New Session";
            startBtn.disabled = false;
        });

        async function generatePhotoStrip(dataUrls) {
            const imgHeight = snapshotCanvas.height;
            const imgWidth = snapshotCanvas.width;
            const padding = 24; 

            const singlePhotoAspect = imgHeight / imgWidth;
            const targetWidth = 600;
            const targetPhotoWidth = targetWidth - (2 * padding);
            const targetPhotoHeight = targetPhotoWidth * singlePhotoAspect;
            const totalStripHeight = (5 * padding) + (4 * targetPhotoHeight);

            const stripCanvas = document.createElement('canvas');
            stripCanvas.width = targetWidth;
            stripCanvas.height = totalStripHeight;
            const ctxStrip = stripCanvas.getContext('2d');

            ctxStrip.fillStyle = "#FFFFFF";
            ctxStrip.fillRect(0, 0, targetWidth, totalStripHeight);

            const loadImage = src => new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = src;
            });

            for (let i = 0; i < dataUrls.length; i++) {
                const img = await loadImage(dataUrls[i]);
                const x = padding;
                const y = padding + i * (targetPhotoHeight + padding);

                ctxStrip.drawImage(img, x, y, targetPhotoWidth, targetPhotoHeight);
            }

            finalPhotoImg.src = stripCanvas.toDataURL('image/jpeg', 0.95);
            
            stripContainer.style.display = 'flex';
            stripContainer.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
